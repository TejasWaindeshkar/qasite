<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}QASite{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="{% url 'question_list' %}" class="nav-brand">QASite</a>
    <div class="nav-links">
      {% if user.is_authenticated %}
        <a href="{% url 'ask_question' %}">Ask Question</a>
        <a href="{% url 'profile' username=user.username %}">{{ user.username }}</a>
        <a href="{% url 'logout' %}">Logout</a>
      {% else %}
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'register' %}">Register</a>
      {% endif %}
    </div>
  </nav>

  <!-- MESSAGES (success/error notifications) -->
  <div class="messages">
    {% for message in messages %}
      <div class="message message-{{ message.tags }}">
        {{ message }}
      </div>
    {% endfor %}
  </div>

  <!-- MAIN CONTENT -->
  <main class="container">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
