<!-- users/templates/users/login.html -->
{% extends 'base.html' %}

{% block title %}Login — QASite{% endblock %}

{% block content %}
<div class="auth-card">
<h2>Welcome back</h2>

<form method="POST">
    {% csrf_token %}

    {% for field in form %}
    <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
        <span class="field-error">{{ field.errors.0 }}</span>
        {% endif %}
    </div>
    {% endfor %}

    <button type="submit" class="btn btn-primary">Login</button>
</form>

<p class="auth-footer">
    No account? <a href="{% url 'register' %}">Register here</a>
</p>
</div>
{% endblock %}
