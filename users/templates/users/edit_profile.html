{% extends 'base.html' %}

{% block title %}Edit Profile — QASite{% endblock %}

{% block content %}
<div class="auth-card">
  <h2>Edit your profile</h2>

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    {% for field in form %}
      <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <span class="field-error">{{ field.errors.0 }}</span>
        {% endif %}
      </div>
    {% endfor %}

    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{% url 'profile' username=request.user.username %}" 
       class="btn btn-secondary" style="margin-top:8px;display:block;text-align:center">
      Cancel
    </a>
  </form>
</div>
{% endblock %}
